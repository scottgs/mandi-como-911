title: CoMo 911
views:

  - title: Near Real-time Fire/Medical
    path: fire-medical
    icon: mdi:ambulance
    type: panel
    cards:

      - type: markdown
        content: |-
          {%- set fetched = state_attr('sensor.columbia_911_fire_medical', 'fetched_at') -%}
          {%- set fetched_display = state_attr('sensor.columbia_911_fire_medical', 'fetched_at_display') -%}
          {%- set calls = state_attr('sensor.columbia_911_fire_medical', 'calls') or [] -%}
          {%- set age_min = ((now() - as_datetime(fetched)).total_seconds() / 60) | round(0) if fetched else none -%}
          <font size="+1"><b>Columbia Fire &amp; Rescue — last 24 hours</b></font>
          {%- if age_min is none %}
          <div><font color="#757575"><i>No data yet</i></font></div>
          {%- elif age_min > 20 %}
          <div><font color="#e65100">⚠ Stale — last updated {{ fetched_display }} ({{ age_min | int }}m ago)</font></div>
          {%- else %}
          <div><font color="#757575">Updated {{ fetched_display }} ({{ age_min | int }}m ago)</font></div>
          {%- endif %}
          <table width="100%">
          <tr><th align="left">Time</th><th align="left">Nature</th><th align="left">Address</th><th align="left">Agency</th></tr>
          {%- for c in calls %}
          <tr>
          <td>{{ c.call_time_display }}</td>
          <td>{% if c.nature_category == 'medical' %}<font color="#1565c0">{{ c.nature }}</font>{% elif c.nature_category == 'fire' %}<font color="#b71c1c"><b>{{ c.nature }}</b></font>{% elif c.nature_category == 'citizen' %}<font color="#2e7d32">{{ c.nature }}</font>{% elif c.nature_category == 'smoke' %}<font color="#424242"><b>{{ c.nature }}</b></font>{% else %}{{ c.nature }}{% endif %}</td>
          <td>{% if c.address_maps_url %}<a href="{{ c.address_maps_url }}" target="_blank">{{ c.address }}</a>{% else %}{{ c.address }}{% endif %}</td>
          <td align="center">{{ c.source_agency }}</td>
          </tr>
          {%- endfor %}
          {%- if not calls %}
          <tr><td colspan="4"><i>No calls in the last 24 hours</i></td></tr>
          {%- endif %}
          </table>

  - title: Delayed Police
    path: police
    icon: mdi:police-badge
    type: panel
    cards:

      - type: markdown
        content: |-
          {%- set fetched = state_attr('sensor.columbia_911_police', 'fetched_at') -%}
          {%- set fetched_display = state_attr('sensor.columbia_911_police', 'fetched_at_display') -%}
          {%- set calls = state_attr('sensor.columbia_911_police', 'calls') or [] -%}
          {%- set age_min = ((now() - as_datetime(fetched)).total_seconds() / 60) | round(0) if fetched else none -%}
          <font size="+1"><b>Columbia Police Dispatch — last 24 hours</b></font>
          <div><font color="#e65100"><i>⚠ Officially ~6 hours delayed per city policy — not live</i></font></div>
          {%- if age_min is none %}
          <div><font color="#757575"><i>No data yet</i></font></div>
          {%- elif age_min > 20 %}
          <div><font color="#e65100">⚠ Stale — last updated {{ fetched_display }} ({{ age_min | int }}m ago)</font></div>
          {%- else %}
          <div><font color="#757575">Updated {{ fetched_display }} ({{ age_min | int }}m ago)</font></div>
          {%- endif %}
          <table width="100%">
          <tr><th align="left">Time</th><th align="left">Type</th><th align="left">Address</th></tr>
          {%- for c in calls %}
          <tr>
          <td>{{ c.call_time_display }}</td>
          <td>{{ c.nature }}</td>
          <td>{% if c.address_maps_url %}<a href="{{ c.address_maps_url }}" target="_blank">{{ c.address }}</a>{% else %}{{ c.address }}{% endif %}</td>
          </tr>
          {%- endfor %}
          {%- if not calls %}
          <tr><td colspan="3"><i>No calls in the last 24 hours</i></td></tr>
          {%- endif %}
          </table>
